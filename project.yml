name: SleepyJoe
options:
  bundleIdPrefix: com.sleepyjoe
  deploymentTarget:
    watchOS: "10.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  SleepyJoe Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: SleepyJoe Watch App
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sleepyjoe.watchapp
        PRODUCT_NAME: Focus
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: "SleepyJoe Watch App/Info.plist"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_WKApplication: true
        INFOPLIST_KEY_WKWatchOnly: true
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_WATCH_OS: true
        TARGETED_DEVICE_FAMILY: 4
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        INFOPLIST_KEY_NSMotionUsageDescription: "Focus uses motion sensors to monitor your activity during sessions."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Focus monitors heart rate to ensure session wellness and prevent drowsiness."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Focus records workout session state for continuous background monitoring."
